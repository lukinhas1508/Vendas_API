name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar e rodar os testes
        run: mvn -B verify

  smoke:
    name: Teste de fumaça com PostgreSQL
    runs-on: ubuntu-latest
    needs: build

    # Valores descartáveis: existem só neste job, para um banco que é destruído ao final.
    env:
      DB_URL: jdbc:postgresql://localhost:5432/vendas
      DB_USERNAME: vendas
      DB_PASSWORD: banco-descartavel-do-ci
      JWT_SECRET: segredo-usado-apenas-no-ci-com-mais-de-32-caracteres
      ADMIN_EMAIL: admin@vendas.local
      ADMIN_PASSWORD: senha-descartavel-do-ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vendas
          POSTGRES_USER: vendas
          POSTGRES_PASSWORD: banco-descartavel-do-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendas -d vendas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Gerar o jar
        run: mvn -B -q package -DskipTests

      - name: Subir a API
        run: nohup java -jar target/vendas-api.jar > api.log 2>&1 &

      - name: Exercitar a API de ponta a ponta
        run: bash scripts/smoke-test.sh

      - name: Mostrar o log da API em caso de falha
        if: failure()
        run: tail -n 200 api.log

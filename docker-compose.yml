# Os valores vêm do arquivo .env (veja .env.example).
#
#   docker compose up -d db      -> só o PostgreSQL (para rodar a API pela IDE ou mvn)
#   docker compose up --build    -> PostgreSQL + API

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # dentro da rede do compose o banco se chama "db", não "localhost"
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
